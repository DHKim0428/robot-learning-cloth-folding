[project]
name = "robot-learning-cloth-folding"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
      "lerobot[dataset,sarm,training,feetech,viz,smolvla,molmoact2,async]",
      "pynput>=1.8.1",
      "scipy>=1.17.1",
      "torch>=2.10.0",
      "torchvision>=0.25.0",
      "transformers>=5.5.4",
]

[tool.uv.sources]
lerobot = { path = "molmoact2", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true