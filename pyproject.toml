[project]
name = "robot-learning-cloth-folding"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
      "lerobot[async,dataset,sarm,training,feetech,viz,smolvla,molmoact2]",
      "pynput>=1.8.1",
      "scipy>=1.17.1",
      "torch==2.8.0",
      "torchvision==0.23.0",
      "torchaudio==2.8.0",
      "transformers>=5.5.4",
]

[tool.uv.sources]
lerobot = { path = "molmoact2", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
